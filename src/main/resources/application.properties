spring.application.name=BaseServer

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.url=jdbc:postgresql://db:5432/sql_db
spring.datasource.username=myuser
spring.datasource.password=${DB_PASSWORD}

spring.data.mongodb.uri=mongodb://mongo:37017/no_sql_db

rsa.private-key= classpath:certs/private.pem
rsa.public-key = classpath:certs/public.pem

server.port=49192

spring.config.import=env.properties


api.tomorrow-api-key=${TOMORROW_API_KEY}
app.cors.allowed-origins=http://localhost:49191

# Board image storage (local filesystem now; swap impl/config for S3 later)
app.storage.local.base-path=./uploads
app.storage.image.max-bytes=10485760
app.media.base-url=/media

# Multipart limits for image upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

ai.provider=deepseek
ai.deepseek.api-key=${DEEPSEEK_TOKEN}
ai.deepseek.base-url=https://api.deepseek.com
ai.deepseek.model=deepseek-v4-pro
ai.deepseek.tag-model=deepseek-v4-flash