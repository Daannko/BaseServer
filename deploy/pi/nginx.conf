# Only login and sign-up are limited: an empty key means no limit. Matched on $request_uri
# because the rewrite below changes $uri before this limit runs.
map $request_uri $auth_limit_key {
    ~^/api/auth/(login|register)(\?|$) $binary_remote_addr;
    default "";
}
limit_req_zone $auth_limit_key zone=auth:1m rate=5r/m;

server {
    listen 80;
    root /usr/share/nginx/html;

    # Requests arrive through Cloudflare and the Pi's nginx: limit per visitor, not per proxy.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;

    # Board images are capped at 10 MB by the backend.
    client_max_body_size 11m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Same-origin API, like proxy.lan.json in the frontend repo. The variable makes
    # nginx re-resolve "backend" after that container restarts.
    location /api/ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @too_many_requests;

        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:49192;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        # Host must stay the browser's, or Spring treats the request as cross-origin.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # AI endpoints wait on the DeepSeek API.
        proxy_read_timeout 300s;
    }

    # Same JSON shape as the backend, the frontend shows "message" in its error popup.
    location @too_many_requests {
        default_type application/json;
        return 429 '{"message":"Too many attempts, try again in a minute","code":429}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
