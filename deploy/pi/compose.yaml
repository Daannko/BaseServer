# Production-style stack for the Raspberry Pi 4 (4 GB). Deployed by deploy.sh.
# The Pi kernel boots with cgroup_disable=memory, so `mem_limit` would be ignored:
# every service caps its own memory through its flags instead.
name: baseserver

services:
  web:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend
    # Reached only through the Pi's nginx (board.vhost.conf), so no other door skips Cloudflare.
    ports:
      - "127.0.0.1:49191:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./front:/usr/share/nginx/html:ro
    networks:
      - app-network

  backend:
    image: eclipse-temurin:17-jre
    restart: unless-stopped
    user: "1000:1000"
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/mydatabase
      - SPRING_DATASOURCE_USERNAME=myuser
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/no_sql_db
      # The Pi's nginx speaks plain http to this stack, so Spring sees the HTTPS origin as foreign.
      - APP_CORS_ALLOWED_ORIGINS=https://board.dannko.com
      - SECURE_COOKIES=true
    command:
      - java
      - -Xmx448m
      - -Xss512k
      - -XX:MaxMetaspaceSize=256m
      - -XX:+UseSerialGC
      - -jar
      - /app/app.jar
    # Under memory pressure the kernel should kill this before Home Assistant.
    oom_score_adj: 500
    volumes:
      - ./app.jar:/app/app.jar:ro
      - ./uploads:/app/uploads
    networks:
      - app-network

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      - POSTGRES_DB=mydatabase
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=30
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db-data:/var/lib/postgresql/
    networks:
      - app-network

  mongo:
    # Newest build that runs here: 5.0+ and 4.4.19+ need ARMv8.2, the Pi 4 is ARMv8.0.
    image: mongo:4.4.18
    restart: unless-stopped
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
  mongo-data:
