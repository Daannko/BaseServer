services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend-app
    depends_on:
      - db
      - mongo # Add MongoDB as a dependency
    ports:
      - "8080:8080"
      - "5005:5005" #for debuging
    networks:
      - app-network
    volumes:
      - ./BaseServer:/app/src
    command: mvn spring-boot:run

  db:
    image: 'postgres:latest'
    environment:
      - POSTGRES_DB=mydatabase
      - POSTGRES_PASSWORD=secret
      - POSTGRES_USER=myuser
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - app-network

  mongo: 
    image: 'mongo:latest'
    container_name: mongo
    ports:
      - '27017:27017'
    networks:
      - app-network
    volumes:
      - mongo-data:/data/db

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
  mongo-data:
